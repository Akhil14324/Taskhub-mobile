<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TaskHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style id="expo-reset">
      /* Inter (SIL OFL) is served as "System": react-native-web's default font family. Icon fonts keep
         their own family; glyphs Inter lacks (e.g. Telugu) fall back to the platform font. */
      @font-face {
        font-family: 'System';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'System';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html, body { height: 100%; }
      body {
        overflow: hidden; margin: 0; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
        font-family: 'System', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: 'cv11', 'ss03'; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      }
      #root { display: flex; height: 100%; flex: 1; }
      /* Keyboard users get a visible focus ring; mouse users do not. */
      [role="button"]:focus-visible, a:focus-visible, button:focus-visible, [tabindex="0"]:not(input):not(textarea):focus-visible {
        outline: 2px solid #0073ea; outline-offset: 2px;
      }
      /* Hover words for icon-only buttons (desktop); appears at once, unlike the slow browser tooltip. */
      @media (hover: hover) {
        [data-tip]:hover::after {
          content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 50%; transform: translateX(50%);
          background: #323338; color: #ffffff; font-size: 12px; font-weight: 500; line-height: 1; white-space: nowrap;
          padding: 6px 8px; border-radius: 4px; pointer-events: none; z-index: 9999;
        }
      }
      /* ------------------------------------------------------------------------------------------
         Surfaces (MONDAY_FEATURE_SPEC.md F-DSN-01). Views mark what they are with data-glass="<variant>"
         (src/theme/glass.js; the attribute name is historical): flat, opaque panels with a hairline border
         and a soft shadow, in light and dark (html[data-theme], set by ThemeProvider). No blur anywhere.
           bar      sidebars, headers            card     cards and tiles
           sheet    dialogs, sheets, palette     capsule  floating input bar, tab bar, toasts
           button   secondary controls, chips    accent   the primary action (blue, white text)
           menu     dropdowns                    inset    a tile inside a panel
           tint     the selected tab / entry     scrim    the dim layer behind a dialog
         ------------------------------------------------------------------------------------------ */
      :root {
        color-scheme: light;
        --s-page: 246 247 251;
        --s-surface: 255 255 255;
        --s-alt: 245 246 248;
        --s-border: 208 212 228;
        --s-primary: 0 115 234;
        --s-primary-strong: 0 96 185;
        --s-primary-soft: 204 229 255;
        --s-shadow: 0 0 0;
        --s-shadow-a: 0.08;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --s-page: 24 27 52;
        --s-surface: 48 50 78;
        --s-alt: 41 47 76;
        --s-border: 75 78 105;
        --s-primary: 0 115 234;
        --s-primary-strong: 61 140 240;
        --s-primary-soft: 19 55 116;
        --s-shadow: 0 0 0;
        --s-shadow-a: 0.32;
      }
      html, body { background-color: rgb(var(--s-page)); }

      [data-glass] { -webkit-backdrop-filter: none; backdrop-filter: none; background-image: none !important; }
      [data-glass='bar'] {
        background-color: rgb(var(--s-surface)) !important;
        box-shadow: 0 0 0 1px rgb(var(--s-border) / 0.6) !important;
      }
      [data-glass='card'] {
        background-color: rgb(var(--s-surface)) !important;
        box-shadow: 0 0 0 1px rgb(var(--s-border) / 0.7), 0 1px 2px rgb(var(--s-shadow) / var(--s-shadow-a)) !important;
      }
      [data-glass='sheet'] {
        background-color: rgb(var(--s-surface)) !important;
        box-shadow: 0 0 0 1px rgb(var(--s-border) / 0.5), 0 24px 64px -12px rgb(var(--s-shadow) / calc(var(--s-shadow-a) * 3)),
          0 6px 16px -6px rgb(var(--s-shadow) / calc(var(--s-shadow-a) * 1.5)) !important;
      }
      [data-glass='capsule'] {
        background-color: rgb(var(--s-surface)) !important;
        box-shadow: 0 0 0 1px rgb(var(--s-border) / 0.7), 0 8px 24px -8px rgb(var(--s-shadow) / calc(var(--s-shadow-a) * 2.5)) !important;
      }
      [data-glass='button'] {
        background-color: rgb(var(--s-alt)) !important;
        box-shadow: inset 0 0 0 1px rgb(var(--s-border) / 0.8) !important;
      }
      [data-glass='accent'] {
        background-color: rgb(var(--s-primary)) !important;
        box-shadow: 0 1px 2px rgb(var(--s-shadow) / var(--s-shadow-a)) !important;
      }
      [data-glass='accent-deep'] {
        background-color: rgb(var(--s-primary-strong)) !important;
        box-shadow: 0 1px 2px rgb(var(--s-shadow) / var(--s-shadow-a)) !important;
      }
      [data-glass='tint'] {
        background-color: rgb(var(--s-primary-soft)) !important;
        box-shadow: none !important;
      }
      [data-glass='menu'] {
        background-color: rgb(var(--s-surface)) !important;
        box-shadow: 0 0 0 1px rgb(var(--s-border) / 0.6), 0 12px 32px -8px rgb(var(--s-shadow) / calc(var(--s-shadow-a) * 2.5)) !important;
      }
      [data-glass='inset'] {
        background-color: rgb(var(--s-alt)) !important;
        box-shadow: none !important;
      }
      [data-glass='scrim'] { background-color: rgb(16 18 40 / 0.36) !important; }
      html[data-theme='dark'] [data-glass='scrim'] { background-color: rgb(0 0 0 / 0.55) !important; }
      [data-glass='sheet'][data-morphing] { will-change: left, top, width, height; }
      @media (prefers-contrast: more) {
        [data-glass] { box-shadow: inset 0 0 0 1px rgb(128 128 128 / 0.8) !important; }
      }
      #root { letter-spacing: -0.006em; font-synthesis: none; text-rendering: optimizeLegibility; }
      * { scrollbar-width: thin; scrollbar-color: rgb(150 153 166 / 0.45) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-thumb { background: rgb(150 153 166 / 0.45); border-radius: 8px; }
    </style>
  </head>
  <body>
    <noscript>TaskHub needs JavaScript to run.</noscript>
    <div id="root"></div>
    <!-- Water: a shared displacement filter. A pressed control borrows it for half a second (see utils/water.js)
         and its pixels ripple like a disturbed surface; scale is 0 (no effect) the rest of the time. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="th-water" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="1" seed="7" result="noise" />
        <feDisplacementMap id="th-water-map" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }

      // An installed PWA can stay open for days on an old bundle. Whenever the app comes back to
      // the foreground, compare the running bundle with the deployed one and reload if it changed.
      (function () {
        var checking = false;
        function check() {
          var running = document.querySelector('script[src*="/_expo/static/js/web/"]');
          if (checking || !running) return;
          checking = true;
          fetch('/', { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/\/_expo\/static\/js\/web\/[^"']+\.js/);
              if (m && running.src.indexOf(m[0]) === -1) location.reload();
            })
            .catch(function () {})
            .then(function () { checking = false; });
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
      })();
    </script>
  </body>
</html>
