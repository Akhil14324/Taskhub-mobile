<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#dc2626" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="TaskHub" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style id="expo-reset">
      /* Inter (SIL OFL) is served as "System": react-native-web's default font family. Icon fonts keep
         their own family; glyphs Inter lacks (e.g. Telugu) fall back to the platform font. */
      @font-face {
        font-family: 'System';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-ext-wght-normal.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'System';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      html, body { height: 100%; }
      body {
        overflow: hidden; margin: 0; overscroll-behavior: none; -webkit-tap-highlight-color: transparent;
        font-family: 'System', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        font-feature-settings: 'cv11', 'ss03'; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      }
      #root { display: flex; height: 100%; flex: 1; }
      /* Keyboard users (desktop shortcuts) get a visible focus ring; mouse users do not. */
      [role="button"]:focus-visible, a:focus-visible, button:focus-visible, [tabindex="0"]:not(input):not(textarea):focus-visible {
        outline: 2px solid #dc2626; outline-offset: 2px;
      }
      /* Hover words for icon-only buttons (desktop); appears at once, unlike the slow browser tooltip. */
      @media (hover: hover) {
        [data-tip]:hover::after {
          content: attr(data-tip); position: absolute; top: calc(100% + 6px); right: 50%; transform: translateX(50%);
          background: #262626; color: #fafafa; font-size: 12px; font-weight: 600; line-height: 1; white-space: nowrap;
          padding: 6px 8px; border-radius: 6px; pointer-events: none; z-index: 9999;
        }
      }
      /* ------------------------------------------------------------------------------------------
         Liquid Glass. One material system, driven by data-glass="<variant>" on any view (see
         src/theme/glass.js) and by html[data-theme] (set by ThemeProvider). Ingredients, always
         together: heavy blur, saturation boost, a specular top edge, and a coloured atmosphere behind.
         Never nest backdrop-filter: inside a blurred panel use data-glass="inset" (tint + sheen only).
         The UI stays one colour, so the atmosphere is red only.
         ------------------------------------------------------------------------------------------ */
      :root {
        color-scheme: light;
        --g-panel: 255 246 246;
        --g-solid: 255 255 255;
        --g-ink: 24 8 8;
        --g-edge: 255 255 255;
        --g-edge-a: 0.85;
        --g-rim: 255 255 255;
        --g-rim-a: 0.6;
        --g-mix-bar: 0.30; --g-mix-card: 0.36; --g-mix-sheet: 0.56; --g-mix-inset: 0.5; --g-mix-menu: 0.88;
        --g-sat: 230%;
        --g-gloss: 0.5;
        --aura-a: 0.5; --aura-b: 0.4; --aura-c: 0.34; --aura-d: 0.3;
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        --g-panel: 44 30 32;
        --g-solid: 24 20 20;
        --g-ink: 0 0 0;
        --g-edge-a: 0.3;
        --g-rim-a: 0.14;
        --g-mix-bar: 0.34; --g-mix-card: 0.4; --g-mix-sheet: 0.6; --g-mix-inset: 0.5; --g-mix-menu: 0.92;
        --g-sat: 200%;
        --g-gloss: 0.16;
        --aura-a: 0.55; --aura-b: 0.42; --aura-c: 0.34; --aura-d: 0.3;
      }
      /* The atmosphere glass refracts: red light with real colour variation, so a pane over it looks like glass
         and not like a white card. Static: no full-viewport motion. */
      body::before {
        content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background:
          radial-gradient(46vmax 40vmax at 6% -4%, rgb(239 68 68 / var(--aura-a)), transparent 64%),
          radial-gradient(40vmax 36vmax at 102% 10%, rgb(251 113 133 / var(--aura-b)), transparent 62%),
          radial-gradient(34vmax 30vmax at 34% 62%, rgb(252 165 165 / var(--aura-d)), transparent 66%),
          radial-gradient(38vmax 34vmax at 86% 88%, rgb(248 113 113 / var(--aura-c)), transparent 64%),
          radial-gradient(56vmax 40vmax at 40% 112%, rgb(220 38 38 / var(--aura-c)), transparent 66%);
      }
      html[data-theme='dark'] body::before {
        background:
          radial-gradient(46vmax 40vmax at 6% -4%, rgb(220 38 38 / var(--aura-a)), transparent 64%),
          radial-gradient(40vmax 36vmax at 102% 10%, rgb(153 27 27 / var(--aura-b)), transparent 62%),
          radial-gradient(34vmax 30vmax at 34% 62%, rgb(127 29 29 / var(--aura-d)), transparent 66%),
          radial-gradient(38vmax 34vmax at 86% 88%, rgb(185 28 28 / var(--aura-c)), transparent 64%),
          radial-gradient(56vmax 40vmax at 40% 112%, rgb(153 27 27 / var(--aura-c)), transparent 66%);
      }

      /* Aqua: the gel highlight. A bright band across the upper half that fades out, over a faint
         cooler-to-warmer body tint, plus an inner glow and a lit lower lip. All of it is on the element itself
         (no pseudo-elements, no nested blur), so any view can wear it. */
      [data-glass] {
        -webkit-backdrop-filter: blur(var(--g-blur, 28px)) saturate(var(--g-sat)) brightness(1.04);
        backdrop-filter: blur(var(--g-blur, 28px)) saturate(var(--g-sat)) brightness(1.04);
        border-color: transparent !important;
        --g-sheen: linear-gradient(180deg, rgb(255 255 255 / calc(var(--g-gloss) * var(--g-sheen-k, 1))) 0%, rgb(255 255 255 / calc(var(--g-gloss) * 0.22 * var(--g-sheen-k, 1))) 42%, rgb(255 255 255 / 0) 56%);
        --g-lip: inset 0 -1px 0 rgb(255 255 255 / calc(var(--g-rim-a) * 0.55));
        --g-glow: inset 0 0 22px rgb(255 255 255 / calc(var(--g-gloss) * 0.34));
      }
      /* bar: navigation chrome (sidebar, headers): a tall pane, so the sheen is a soft wash, not a band */
      [data-glass='bar'] {
        --g-blur: 36px; --g-sheen-k: 0.5;
        background-color: rgb(var(--g-panel) / var(--g-mix-bar)) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / var(--g-edge-a)), inset 0 0 0 1px rgb(255 255 255 / var(--g-rim-a)), var(--g-lip), var(--g-glow),
          0 10px 36px -14px rgb(var(--g-ink) / 0.22) !important;
      }
      /* card: task cards and content tiles */
      [data-glass='card'] {
        --g-blur: 24px; --g-sheen-k: 0.8;
        background-color: rgb(var(--g-panel) / var(--g-mix-card)) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / var(--g-edge-a)), inset 0 0 0 1px rgb(255 255 255 / var(--g-rim-a)), var(--g-lip), var(--g-glow),
          0 8px 22px -10px rgb(var(--g-ink) / 0.2) !important;
      }
      /* sheet: modals, bottom sheets, dialogs, palette: thickest material, deepest shadow */
      [data-glass='sheet'] {
        --g-blur: 46px; --g-sheen-k: 0.9;
        background-color: rgb(var(--g-panel) / var(--g-mix-sheet)) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / calc(var(--g-edge-a) + 0.1)), inset 0 0 0 1px rgb(255 255 255 / var(--g-rim-a)), var(--g-lip), var(--g-glow),
          0 34px 90px -22px rgb(var(--g-ink) / 0.46), 0 10px 28px -8px rgb(var(--g-ink) / 0.22) !important;
      }
      /* capsule: the floating input bar and the tab bar island: a full-height gel highlight */
      [data-glass='capsule'] {
        --g-blur: 42px; --g-sheen-k: 1.15;
        background-color: rgb(var(--g-panel) / var(--g-mix-bar)) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / calc(var(--g-edge-a) + 0.1)), inset 0 0 0 1px rgb(255 255 255 / var(--g-rim-a)),
          inset 0 -12px 22px rgb(var(--g-ink) / 0.05), var(--g-lip), var(--g-glow), 0 20px 48px -14px rgb(var(--g-ink) / 0.42), 0 3px 10px rgb(var(--g-ink) / 0.1) !important;
      }
      /* button: light frost for secondary controls and chips */
      [data-glass='button'] {
        --g-blur: 22px; --g-sheen-k: 1;
        background-color: rgb(var(--g-panel) / 0.42) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / var(--g-edge-a)), inset 0 0 0 1px rgb(255 255 255 / var(--g-rim-a)), var(--g-lip),
          0 5px 16px -6px rgb(var(--g-ink) / 0.26) !important;
      }
      /* accent: the one coloured glass: translucent brand red, a gel highlight, a lit lip and a glow */
      [data-glass='accent'] {
        -webkit-backdrop-filter: none; backdrop-filter: none;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.42) 0%, rgb(255 255 255 / 0.1) 46%, rgb(255 255 255 / 0) 54%),
          linear-gradient(180deg, rgb(248 113 113 / 0.96), rgb(220 38 38 / 0.9) 60%, rgb(185 28 28 / 0.92)) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.6), inset 0 0 0 1px rgb(255 255 255 / 0.2), inset 0 -8px 16px rgb(127 29 29 / 0.28), inset 0 -1px 0 rgb(255 255 255 / 0.22),
          0 10px 26px -8px rgb(220 38 38 / 0.6), 0 2px 6px rgb(127 29 29 / 0.3) !important;
      }
      [data-glass='accent-deep'] {
        -webkit-backdrop-filter: none; backdrop-filter: none;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.3) 0%, rgb(255 255 255 / 0.06) 46%, rgb(255 255 255 / 0) 54%),
          linear-gradient(180deg, rgb(220 38 38 / 0.96), rgb(185 28 28 / 0.94) 55%, rgb(127 29 29 / 0.96)) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.4), inset 0 0 0 1px rgb(255 255 255 / 0.14), inset 0 -8px 16px rgb(69 10 10 / 0.35),
          0 10px 26px -8px rgb(153 27 27 / 0.65), 0 2px 6px rgb(69 10 10 / 0.35) !important;
      }
      /* tint: the light-red highlight that slides under the selected tab / segment / entry */
      [data-glass='tint'] {
        -webkit-backdrop-filter: none; backdrop-filter: none;
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.55) 0%, rgb(255 255 255 / 0.1) 50%, rgb(255 255 255 / 0) 60%),
          rgb(239 68 68 / 0.15) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.7), inset 0 0 0 1px rgb(220 38 38 / 0.2), inset 0 -1px 0 rgb(255 255 255 / 0.3),
          0 6px 16px -8px rgb(220 38 38 / 0.5) !important;
      }
      html[data-theme='dark'] [data-glass='tint'] {
        background:
          linear-gradient(180deg, rgb(255 255 255 / 0.2) 0%, rgb(255 255 255 / 0.04) 50%, rgb(255 255 255 / 0) 60%),
          rgb(248 113 113 / 0.2) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.28), inset 0 0 0 1px rgb(248 113 113 / 0.3), 0 6px 16px -8px rgb(0 0 0 / 0.5) !important;
      }
      /* menu: dropdowns over busy content stay near-opaque so small text is readable */
      [data-glass='menu'] {
        --g-blur: 30px; --g-sheen-k: 0.5;
        background-color: rgb(var(--g-panel) / var(--g-mix-menu)) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / var(--g-edge-a)), inset 0 0 0 1px rgb(255 255 255 / var(--g-rim-a)), var(--g-lip),
          0 22px 54px -14px rgb(var(--g-ink) / 0.42) !important;
      }
      /* inset: tiles inside a glass panel. NO backdrop-filter (nesting breaks compositing). */
      [data-glass='inset'] {
        -webkit-backdrop-filter: none; backdrop-filter: none; --g-sheen-k: 0.7;
        background-color: rgb(var(--g-panel) / var(--g-mix-inset)) !important;
        background-image: var(--g-sheen) !important;
        box-shadow: inset 0 1px 0 rgb(255 255 255 / calc(var(--g-edge-a) * 0.8)), inset 0 0 0 1px rgb(255 255 255 / calc(var(--g-rim-a) * 0.8)),
          0 1px 3px rgb(var(--g-ink) / 0.1) !important;
      }
      /* scrim behind sheets: dims and softens the page (a modal pushes the world back). */
      [data-glass='scrim'] {
        -webkit-backdrop-filter: blur(10px) saturate(130%); backdrop-filter: blur(10px) saturate(130%);
      }
      /* Typography: SF-like tracking (large text tightens in JS; this is the body default). */
      #root { letter-spacing: -0.011em; font-synthesis: none; text-rendering: optimizeLegibility; }
      @media (prefers-reduced-transparency: reduce) {
        [data-glass]:not([data-glass='accent']) { -webkit-backdrop-filter: none; backdrop-filter: none; background-color: rgb(var(--g-solid)) !important; background-image: none !important; }
      }
      @media (prefers-contrast: more) {
        [data-glass]:not([data-glass='accent']) { -webkit-backdrop-filter: none; backdrop-filter: none; background-color: rgb(var(--g-solid)) !important; background-image: none !important; box-shadow: inset 0 0 0 1px rgb(128 128 128 / 0.6) !important; }
      }
      @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
        [data-glass]:not([data-glass='accent']):not([data-glass='inset']) { background-color: rgb(var(--g-solid) / 0.94) !important; }
      }
      * { scrollbar-width: thin; scrollbar-color: rgba(120, 120, 130, 0.35) transparent; }
      *::-webkit-scrollbar { width: 8px; height: 8px; }
      *::-webkit-scrollbar-thumb { background: rgba(120, 120, 130, 0.35); border-radius: 8px; }
    </style>
  </head>
  <body>
    <noscript>TaskHub needs JavaScript to run.</noscript>
    <div id="root"></div>
    <!-- Water: a shared displacement filter. A pressed control borrows it for half a second (see utils/water.js)
         and its pixels ripple like a disturbed surface; scale is 0 (no effect) the rest of the time. -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="th-water" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
        <feTurbulence type="fractalNoise" baseFrequency="0.018 0.045" numOctaves="2" seed="7" result="noise" />
        <feDisplacementMap id="th-water-map" in="SourceGraphic" in2="noise" scale="0" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').catch(function () {});
        });
      }

      // An installed PWA can stay open for days on an old bundle. Whenever the app comes back to
      // the foreground, compare the running bundle with the deployed one and reload if it changed.
      (function () {
        var checking = false;
        function check() {
          var running = document.querySelector('script[src*="/_expo/static/js/web/"]');
          if (checking || !running) return;
          checking = true;
          fetch('/', { cache: 'no-store' })
            .then(function (r) { return r.text(); })
            .then(function (html) {
              var m = html.match(/\/_expo\/static\/js\/web\/[^"']+\.js/);
              if (m && running.src.indexOf(m[0]) === -1) location.reload();
            })
            .catch(function () {})
            .then(function () { checking = false; });
        }
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'visible') check();
        });
      })();
    </script>
  </body>
</html>
